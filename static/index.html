<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Exam Generator</title>
  <link rel="stylesheet" href="/static/index.css" />
</head>
<body>
<div class="layout">
  <!-- Left sidebar: upload + documents -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>AI Exam Generator</h1>
      <p class="subtitle">Upload documents, then chat with AI</p>
      <a href="/exam" style="display:inline-block;margin-top:8px;padding:6px 14px;border-radius:8px;background:#4f46e5;color:#fff;text-decoration:none;font-size:0.82rem;font-weight:600;">Generate Exam</a>
    </div>

    <div class="upload-area">
      <div class="upload-card" id="drop-zone">
        <p>Drop a file here, or click to browse</p>
        <label for="file-input" class="btn btn-outline">Choose File</label>
        <input type="file" id="file-input" accept=".pdf,.pptx,.txt" />
        <div class="file-name" id="file-name"></div>
      </div>
      <button class="btn btn-primary" id="upload-btn" disabled>Upload Document</button>
      <div id="status"></div>
    </div>

    <div class="section-title">Documents <span style="font-weight:400;color:#9ca3af;font-size:0.78rem;">(click to select one for chat)</span></div>
    <div id="doc-list" class="doc-list">
      <div class="empty-state">No documents uploaded yet.</div>
    </div>
  </div>

  <!-- Right panel: chat -->
  <div class="chat-panel">
    <div class="chat-header">
      <div>
        <h2>Chat</h2>
        <div class="chat-doc-hint" id="chat-doc-hint">Select documents on the left to scope your questions</div>
      </div>
      <button class="btn-clear" id="clear-chat-btn">Clear Chat</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">Select a document and ask a question to get started.</div>
    </div>
    <div class="chat-input-bar">
      <textarea id="chat-input" placeholder="Ask a question about your documents..." rows="1"></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>
</div>

<!-- Preview overlay -->
<div class="preview-overlay" id="preview-overlay">
  <div class="preview-box">
    <div class="preview-header">
      <h3 id="preview-title">Preview</h3>
      <button class="preview-close" onclick="closePreview()">&times;</button>
    </div>
    <div class="preview-content" id="preview-content"></div>
  </div>
</div>

<script src="/static/js/index-state.js"></script>
<script src="/static/js/index-upload.js"></script>
<script src="/static/js/index-documents.js"></script>
<script src="/static/js/index-chat.js"></script>
</body>
</html>
