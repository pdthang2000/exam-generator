<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Exam Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      height: 100vh;
    }

    /* --- Left panel: documents --- */
    .sidebar {
      width: 340px;
      min-width: 280px;
      background: #fff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 20px 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .sidebar-header h1 { font-size: 1.25rem; font-weight: 700; }
    .sidebar-header .subtitle { color: #666; font-size: 0.85rem; margin-top: 4px; }

    .upload-area {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .upload-card {
      background: #f9fafb;
      border: 2px dashed #d1d5db;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      transition: border-color 0.2s;
      cursor: pointer;
    }

    .upload-card:hover, .upload-card.dragover { border-color: #4f46e5; }
    .upload-card p { color: #555; font-size: 0.85rem; margin-bottom: 10px; }
    #file-input { display: none; }

    .btn {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4338ca; }
    .btn-outline { background: transparent; border: 2px solid #4f46e5; color: #4f46e5; font-size: 0.8rem; padding: 6px 14px; }
    .btn-outline:hover { background: #eef2ff; }
    .btn-danger { background: transparent; border: none; color: #dc2626; cursor: pointer; font-size: 0.8rem; padding: 4px 6px; }
    .btn-danger:hover { text-decoration: underline; }

    .file-name {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #4f46e5;
      font-weight: 500;
    }

    #upload-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 0.9rem;
    }

    .status {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .status.loading { background: #eef2ff; color: #4338ca; }
    .status.error { background: #fee2e2; color: #b91c1c; }
    .status.success { background: #f0fdf4; color: #16a34a; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #c7d2fe;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      padding: 14px 20px 8px;
      color: #374151;
    }

    .doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px;
    }

    .doc-item {
      background: #f9fafb;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s;
      border: 2px solid transparent;
    }

    .doc-item:hover { background: #eef2ff; }
    .doc-item.selected { border-color: #4f46e5; background: #eef2ff; }

    .doc-info { display: flex; align-items: center; gap: 10px; min-width: 0; }

    .doc-icon {
      width: 32px; height: 32px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .doc-icon.pdf { background: #fee2e2; }
    .doc-icon.pptx { background: #fef3c7; }
    .doc-icon.txt { background: #e0e7ff; }

    .doc-text { min-width: 0; }
    .doc-name { font-weight: 500; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-meta { font-size: 0.72rem; color: #6b7280; margin-top: 2px; }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: #9ca3af;
      font-size: 0.85rem;
    }

    .doc-actions { display: flex; gap: 8px; align-items: center; padding-left: 42px; }

    .btn-preview { background: transparent; border: none; color: #4f46e5; cursor: pointer; font-size: 0.8rem; padding: 4px 6px; }
    .btn-preview:hover { text-decoration: underline; }

    /* --- Right panel: chat --- */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }

    .chat-header h2 { font-size: 1.1rem; font-weight: 600; }

    .chat-doc-hint {
      font-size: 0.8rem;
      color: #6b7280;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid #d1d5db;
      color: #6b7280;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .btn-clear:hover { background: #f3f4f6; color: #374151; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 0.95rem;
      text-align: center;
      padding: 40px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      color: #222;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .msg.thinking {
      align-self: flex-start;
      background: #f3f4f6;
      color: #9ca3af;
      font-style: italic;
    }

    .chat-input-bar {
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
    }

    .chat-input-bar textarea {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
    }

    .chat-input-bar textarea:focus { border-color: #4f46e5; }

    .chat-input-bar button {
      padding: 0 20px;
      border-radius: 10px;
      border: none;
      background: #4f46e5;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chat-input-bar button:hover { background: #4338ca; }
    .chat-input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* --- Preview overlay --- */
    .preview-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .preview-overlay.open { display: flex; }

    .preview-box {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      max-width: 720px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .preview-header h3 { font-size: 1.1rem; }

    .preview-close {
      background: none; border: none; font-size: 1.4rem;
      cursor: pointer; color: #6b7280; padding: 0 4px;
    }

    .preview-content {
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #374151;
      background: #f9fafb;
      border-radius: 8px;
      padding: 16px;
    }

    @media (max-width: 768px) {
      .layout { flex-direction: column; height: auto; min-height: 100vh; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e5e7eb; max-height: 45vh; }
      .chat-panel { min-height: 55vh; }
      .msg { max-width: 90%; }
    }
  </style>
</head>
<body>
<div class="layout">
  <!-- Left sidebar: upload + documents -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>AI Exam Generator</h1>
      <p class="subtitle">Upload documents, then chat with AI</p>
      <a href="/exam" style="display:inline-block;margin-top:8px;padding:6px 14px;border-radius:8px;background:#4f46e5;color:#fff;text-decoration:none;font-size:0.82rem;font-weight:600;">Generate Exam</a>
    </div>

    <div class="upload-area">
      <div class="upload-card" id="drop-zone">
        <p>Drop a file here, or click to browse</p>
        <label for="file-input" class="btn btn-outline">Choose File</label>
        <input type="file" id="file-input" accept=".pdf,.pptx,.txt" />
        <div class="file-name" id="file-name"></div>
      </div>
      <button class="btn btn-primary" id="upload-btn" disabled>Upload Document</button>
      <div id="status"></div>
    </div>

    <div class="section-title">Documents <span style="font-weight:400;color:#9ca3af;font-size:0.78rem;">(click to select one for chat)</span></div>
    <div id="doc-list" class="doc-list">
      <div class="empty-state">No documents uploaded yet.</div>
    </div>
  </div>

  <!-- Right panel: chat -->
  <div class="chat-panel">
    <div class="chat-header">
      <div>
        <h2>Chat</h2>
        <div class="chat-doc-hint" id="chat-doc-hint">Select documents on the left to scope your questions</div>
      </div>
      <button class="btn-clear" id="clear-chat-btn">Clear Chat</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">Select a document and ask a question to get started.</div>
    </div>
    <div class="chat-input-bar">
      <textarea id="chat-input" placeholder="Ask a question about your documents..." rows="1"></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>
</div>

<!-- Preview overlay -->
<div class="preview-overlay" id="preview-overlay">
  <div class="preview-box">
    <div class="preview-header">
      <h3 id="preview-title">Preview</h3>
      <button class="preview-close" onclick="closePreview()">&times;</button>
    </div>
    <div class="preview-content" id="preview-content"></div>
  </div>
</div>

<script>
  const fileInput = document.getElementById("file-input");
  const dropZone = document.getElementById("drop-zone");
  const fileNameEl = document.getElementById("file-name");
  const uploadBtn = document.getElementById("upload-btn");
  const statusEl = document.getElementById("status");
  const docListEl = document.getElementById("doc-list");
  const chatMessages = document.getElementById("chat-messages");
  const chatEmpty = document.getElementById("chat-empty");
  const chatInput = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");
  const chatDocHint = document.getElementById("chat-doc-hint");

  let selectedFile = null;
  let selectedDocId = null;
  let allDocs = [];
  let sending = false;

  const ALLOWED = ["pdf", "pptx", "txt"];
  const ICONS = { pdf: "\u{1F4D5}", pptx: "\u{1F4CA}", txt: "\u{1F4DD}" };

  // --- Upload ---

  dropZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));
  dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(f) {
    if (!f) return;
    const ext = f.name.split(".").pop().toLowerCase();
    if (!ALLOWED.includes(ext)) {
      statusEl.innerHTML = '<div class="status error">Unsupported file type. Allowed: PDF, PPTX, TXT</div>';
      return;
    }
    selectedFile = f;
    fileNameEl.textContent = f.name;
    uploadBtn.disabled = false;
    statusEl.innerHTML = "";
  }

  uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    uploadBtn.disabled = true;
    statusEl.innerHTML = '<div class="status loading"><span class="spinner"></span>Uploading & indexing...</div>';

    const form = new FormData();
    form.append("file", selectedFile);

    try {
      const res = await fetch("/api/documents", { method: "POST", body: form });
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch { throw new Error("Server error"); }
      if (!res.ok) throw new Error(data.error || "Upload failed");
      statusEl.innerHTML = '<div class="status success">Indexed (' + data.chunk_count + ' chunks)</div>';
      selectedFile = null;
      fileNameEl.textContent = "";
      fileInput.value = "";
      loadDocuments();
    } catch (err) {
      statusEl.innerHTML = '<div class="status error">' + err.message + '</div>';
      uploadBtn.disabled = false;
    }
  });

  // --- Documents ---

  async function loadDocuments() {
    const res = await fetch("/api/documents");
    allDocs = await res.json();

    if (selectedDocId && !allDocs.some(d => d.id === selectedDocId)) {
      selectedDocId = null;
    }

    renderDocList();
    updateChatHint();
  }

  function renderDocList() {
    if (allDocs.length === 0) {
      docListEl.innerHTML = '<div class="empty-state">No documents uploaded yet.</div>';
      return;
    }

    docListEl.innerHTML = allDocs.map(doc => {
      const sel = selectedDocId === doc.id ? "selected" : "";
      return '<div class="doc-item ' + sel + '" data-id="' + doc.id + '">' +
        '<div class="doc-info" onclick="toggleDoc(' + doc.id + ')">' +
          '<div class="doc-icon ' + doc.file_type + '">' + (ICONS[doc.file_type] || "\u{1F4C4}") + '</div>' +
          '<div class="doc-text">' +
            '<div class="doc-name">' + doc.filename + '</div>' +
            '<div class="doc-meta">' + doc.file_type.toUpperCase() + ' · ' + (doc.chunk_count || 0) + ' chunks</div>' +
          '</div>' +
        '</div>' +
        '<div class="doc-actions">' +
          '<button class="btn-preview" onclick="event.stopPropagation();previewDoc(' + doc.id + ',\'' + doc.filename.replace(/'/g, "\\'") + '\')">Preview</button>' +
          '<button class="btn-danger" onclick="event.stopPropagation();deleteDoc(' + doc.id + ')">Remove</button>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  function toggleDoc(id) {
    selectedDocId = selectedDocId === id ? null : id;
    renderDocList();
    updateChatState();
    if (selectedDocId) {
      loadChatHistory(selectedDocId);
    } else {
      chatMessages.innerHTML = '<div class="chat-empty" id="chat-empty">Select a document to start chatting.</div>';
    }
  }

  function updateChatState() {
    if (!selectedDocId) {
      chatDocHint.textContent = "Select a document on the left to start chatting";
      chatInput.disabled = true;
      chatInput.placeholder = "Select a document first...";
      sendBtn.disabled = true;
    } else {
      const doc = allDocs.find(d => d.id === selectedDocId);
      chatDocHint.textContent = "Chatting with: " + (doc ? doc.filename : "");
      chatInput.disabled = false;
      chatInput.placeholder = "Ask a question about your document...";
      sendBtn.disabled = !chatInput.value.trim() || sending;
    }
  }

  async function loadChatHistory(docId) {
    chatMessages.innerHTML = "";
    try {
      const res = await fetch("/api/chat/history/" + docId);
      const history = await res.json();
      if (history.length === 0) {
        chatMessages.innerHTML = '<div class="chat-empty">No conversation yet. Ask a question to get started.</div>';
      } else {
        for (const msg of history) {
          appendMsg(msg.role, msg.content);
        }
      }
    } catch (err) {
      chatMessages.innerHTML = '<div class="chat-empty">Failed to load history.</div>';
    }
  }

  async function previewDoc(id, filename) {
    const overlay = document.getElementById("preview-overlay");
    document.getElementById("preview-title").textContent = filename;
    document.getElementById("preview-content").textContent = "Loading...";
    overlay.classList.add("open");

    try {
      const res = await fetch("/api/documents/" + id + "/preview");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      document.getElementById("preview-content").textContent = data.text;
    } catch (err) {
      document.getElementById("preview-content").textContent = "Error: " + err.message;
    }
  }

  function closePreview() {
    document.getElementById("preview-overlay").classList.remove("open");
  }

  document.getElementById("preview-overlay").addEventListener("click", e => {
    if (e.target === e.currentTarget) closePreview();
  });

  async function deleteDoc(id) {
    await fetch("/api/documents/" + id, { method: "DELETE" });
    loadDocuments();
  }

  // --- Chat ---

  chatInput.addEventListener("input", () => {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
    sendBtn.disabled = !selectedDocId || !chatInput.value.trim() || sending;
  });

  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener("click", sendMessage);

  async function sendMessage() {
    const message = chatInput.value.trim();
    if (!message || sending || !selectedDocId) return;

    sending = true;
    sendBtn.disabled = true;
    chatInput.value = "";
    chatInput.style.height = "auto";

    const emptyEl = chatMessages.querySelector(".chat-empty");
    if (emptyEl) emptyEl.remove();

    appendMsg("user", message);
    const thinkingEl = appendMsg("thinking", "Thinking...");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: message,
          document_id: selectedDocId || null,
        }),
      });

      const data = await res.json();
      thinkingEl.remove();

      if (!res.ok) throw new Error(data.error || "Chat failed");
      appendMsg("assistant", data.answer);
    } catch (err) {
      thinkingEl.remove();
      appendMsg("assistant", "Error: " + err.message);
    }

    sending = false;
    sendBtn.disabled = !selectedDocId || !chatInput.value.trim();
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function appendMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  document.getElementById("clear-chat-btn").addEventListener("click", async () => {
    if (!selectedDocId) return;
    await fetch("/api/chat/" + selectedDocId, { method: "DELETE" });
    chatMessages.innerHTML = '<div class="chat-empty">No conversation yet. Ask a question to get started.</div>';
  });

  // --- Init ---
  loadDocuments();
  updateChatState();
</script>
</body>
</html>
