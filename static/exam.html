<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Generator</title>
  <link rel="stylesheet" href="/static/exam.css" />
</head>
<body>

<div class="top-bar">
  <h1>Exam Generator</h1>
  <a href="/">&larr; Back to Chat</a>
</div>

<div class="container">
  <!-- Phase: Config -->
  <div id="phase-config">
    <div class="card">
      <h2>Configure Exam</h2>

      <div class="field">
        <label for="doc-select">Document</label>
        <select id="doc-select">
          <option value="">Loading documents...</option>
        </select>
      </div>

      <div class="field">
        <label for="num-questions">Number of Questions</label>
        <input type="number" id="num-questions" min="1" max="20" value="5" />
      </div>

      <h2>Question Types</h2>
      <div class="row">
        <div class="field">
          <label for="tf-count">True / False</label>
          <input type="number" id="tf-count" min="0" max="20" value="2" />
        </div>
        <div class="field">
          <label for="mcq-count">Multiple Choice</label>
          <input type="number" id="mcq-count" min="0" max="20" value="3" />
        </div>
      </div>
      <div class="type-hint" id="type-hint">Must sum to 5</div>

      <h2>Difficulty</h2>
      <div class="preset-bar">
        <button class="preset-btn" data-preset="easy">Easy</button>
        <button class="preset-btn active" data-preset="balanced">Balanced</button>
        <button class="preset-btn" data-preset="hard">Hard</button>
        <button class="preset-btn" data-preset="custom">Custom</button>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <label for="easy-slider">Easy</label>
          <span class="slider-value" id="easy-value">33%</span>
        </div>
        <input type="range" id="easy-slider" min="0" max="100" value="33" />
      </div>
      <div class="slider-group">
        <div class="slider-header">
          <label for="medium-slider">Medium</label>
          <span class="slider-value" id="medium-value">34%</span>
        </div>
        <input type="range" id="medium-slider" min="0" max="100" value="34" />
      </div>
      <div class="slider-group">
        <div class="slider-header">
          <label for="hard-slider">Hard</label>
          <span class="slider-value" id="hard-value">33%</span>
        </div>
        <input type="range" id="hard-slider" min="0" max="100" value="33" />
      </div>
      <div class="difficulty-total valid" id="diff-total">Total: 100%</div>

      <button class="btn btn-primary" id="generate-btn" style="margin-top: 20px" disabled>Generate Exam</button>
      <div id="gen-status"></div>
    </div>
  </div>

  <!-- Phase: Mode select -->
  <div id="phase-mode" class="hidden">
    <div class="card">
      <h2>Choose Mode</h2>
      <div class="mode-cards">
        <div class="mode-card" id="mode-review" onclick="selectMode('review')">
          <h3>Review</h3>
          <p>View all questions with answers and export</p>
        </div>
        <div class="mode-card" id="mode-practice" onclick="selectMode('practice')">
          <h3>Practice</h3>
          <p>One question at a time with immediate feedback</p>
        </div>
        <div class="mode-card" id="mode-exam" onclick="selectMode('exam')">
          <h3>Exam</h3>
          <p>All questions at once, graded on submit</p>
        </div>
      </div>
      <button class="btn btn-primary" id="start-quiz-btn" disabled onclick="startQuiz()">Start</button>
    </div>
  </div>

  <!-- Phase: Quiz (practice or exam) -->
  <div id="phase-quiz" class="hidden"></div>

  <!-- Phase: Results -->
  <div id="phase-results" class="hidden"></div>
</div>

<script src="/static/js/exam-state.js"></script>
<script src="/static/js/exam-config.js"></script>
<script src="/static/js/exam-modes.js"></script>
<script src="/static/js/exam-results.js"></script>
<script src="/static/js/exam-export.js"></script>
</body>
</html>
