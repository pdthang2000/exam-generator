<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    .top-bar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-bar h1 { font-size: 1.15rem; font-weight: 700; }
    .top-bar a {
      color: #4f46e5;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .top-bar a:hover { text-decoration: underline; }

    .container {
      max-width: 640px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #374151;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      background: #fff;
    }

    select:focus, input[type="number"]:focus { border-color: #4f46e5; }

    .field { margin-bottom: 16px; }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .field { flex: 1; }

    .preset-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .preset-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      border: 2px solid #e5e7eb;
      background: #f9fafb;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      color: #374151;
      transition: all 0.15s;
    }

    .preset-btn:hover { border-color: #a5b4fc; background: #eef2ff; }
    .preset-btn.active { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; }

    .slider-group { margin-bottom: 10px; }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .slider-header label { margin-bottom: 0; }

    .slider-value {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4f46e5;
      min-width: 36px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #e5e7eb;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4f46e5;
      cursor: pointer;
    }

    .difficulty-total {
      text-align: right;
      font-size: 0.8rem;
      margin-top: 6px;
    }

    .difficulty-total.valid { color: #16a34a; }
    .difficulty-total.invalid { color: #dc2626; }

    .type-hint {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 4px;
    }

    .type-hint.invalid { color: #dc2626; }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #4f46e5; color: #fff; width: 100%; }
    .btn-primary:hover:not(:disabled) { background: #4338ca; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    .status.error { background: #fee2e2; color: #b91c1c; }

    /* --- Generated questions preview --- */
    .questions-preview { margin-top: 20px; }

    .q-card {
      background: #f9fafb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #e5e7eb;
    }

    .q-header {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .q-num {
      font-weight: 700;
      font-size: 0.85rem;
      color: #374151;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-tf { background: #dbeafe; color: #1d4ed8; }
    .badge-mcq { background: #fef3c7; color: #92400e; }
    .badge-easy { background: #dcfce7; color: #166534; }
    .badge-medium { background: #fef9c3; color: #854d0e; }
    .badge-hard { background: #fee2e2; color: #991b1b; }

    .q-text {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #222;
      margin-bottom: 10px;
    }

    .q-options {
      list-style: none;
      padding: 0;
    }

    .q-options li {
      padding: 6px 10px;
      font-size: 0.85rem;
      border-radius: 6px;
      margin-bottom: 4px;
      color: #374151;
    }

    .q-options li.correct {
      background: #dcfce7;
      color: #166534;
      font-weight: 500;
    }

    .q-explanation {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #6b7280;
      font-style: italic;
    }

    .post-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #4f46e5;
      color: #4f46e5;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-outline:hover { background: #eef2ff; }

    .btn-secondary {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      color: #374151;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-secondary:hover { background: #e5e7eb; }

    @media (max-width: 600px) {
      .row { flex-direction: column; gap: 0; }
      .container { padding: 0 12px; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <h1>Exam Generator</h1>
  <a href="/">&larr; Back to Chat</a>
</div>

<div class="container">
  <!-- Config form -->
  <div class="card" id="config-card">
    <h2>Configure Exam</h2>

    <div class="field">
      <label for="doc-select">Document</label>
      <select id="doc-select">
        <option value="">Loading documents...</option>
      </select>
    </div>

    <div class="field">
      <label for="num-questions">Number of Questions</label>
      <input type="number" id="num-questions" min="1" max="20" value="5" />
    </div>

    <h2>Question Types</h2>
    <div class="row">
      <div class="field">
        <label for="tf-count">True / False</label>
        <input type="number" id="tf-count" min="0" max="20" value="2" />
      </div>
      <div class="field">
        <label for="mcq-count">Multiple Choice</label>
        <input type="number" id="mcq-count" min="0" max="20" value="3" />
      </div>
    </div>
    <div class="type-hint" id="type-hint">Must sum to 5</div>

    <h2>Difficulty</h2>
    <div class="preset-bar">
      <button class="preset-btn" data-preset="easy">Easy</button>
      <button class="preset-btn active" data-preset="balanced">Balanced</button>
      <button class="preset-btn" data-preset="hard">Hard</button>
      <button class="preset-btn" data-preset="custom">Custom</button>
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <label for="easy-slider">Easy</label>
        <span class="slider-value" id="easy-value">33%</span>
      </div>
      <input type="range" id="easy-slider" min="0" max="100" value="33" />
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <label for="medium-slider">Medium</label>
        <span class="slider-value" id="medium-value">34%</span>
      </div>
      <input type="range" id="medium-slider" min="0" max="100" value="34" />
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <label for="hard-slider">Hard</label>
        <span class="slider-value" id="hard-value">33%</span>
      </div>
      <input type="range" id="hard-slider" min="0" max="100" value="33" />
    </div>

    <div class="difficulty-total valid" id="diff-total">Total: 100%</div>

    <button class="btn btn-primary" id="generate-btn" style="margin-top: 20px" disabled>Generate Exam</button>
    <div id="gen-status"></div>
  </div>

  <!-- Generated questions -->
  <div id="results-area"></div>
</div>

<script>
  const docSelect = document.getElementById("doc-select");
  const numQuestions = document.getElementById("num-questions");
  const tfCount = document.getElementById("tf-count");
  const mcqCount = document.getElementById("mcq-count");
  const typeHint = document.getElementById("type-hint");
  const easySlider = document.getElementById("easy-slider");
  const mediumSlider = document.getElementById("medium-slider");
  const hardSlider = document.getElementById("hard-slider");
  const easyValue = document.getElementById("easy-value");
  const mediumValue = document.getElementById("medium-value");
  const hardValue = document.getElementById("hard-value");
  const diffTotal = document.getElementById("diff-total");
  const generateBtn = document.getElementById("generate-btn");
  const genStatus = document.getElementById("gen-status");
  const resultsArea = document.getElementById("results-area");

  let allDocs = [];
  let generatedQuestions = null;
  let generating = false;

  const PRESETS = {
    easy: [70, 20, 10],
    balanced: [33, 34, 33],
    hard: [10, 20, 70],
  };

  // --- Load documents ---

  async function loadDocuments() {
    const res = await fetch("/api/documents");
    allDocs = await res.json();

    if (allDocs.length === 0) {
      docSelect.innerHTML = '<option value="">No documents — upload one first</option>';
    } else {
      docSelect.innerHTML = '<option value="">Select a document...</option>' +
        allDocs.map(d => '<option value="' + d.id + '">' + d.filename + ' (' + d.file_type.toUpperCase() + ', ' + (d.chunk_count || 0) + ' chunks)</option>').join("");
    }
    validate();
  }

  // --- Type split validation ---

  function updateTypeHint() {
    const total = parseInt(numQuestions.value) || 0;
    const tf = parseInt(tfCount.value) || 0;
    const mcq = parseInt(mcqCount.value) || 0;
    const sum = tf + mcq;

    typeHint.textContent = "Must sum to " + total + (sum !== total ? " (currently " + sum + ")" : "");
    typeHint.classList.toggle("invalid", sum !== total);
  }

  numQuestions.addEventListener("input", () => {
    updateTypeHint();
    validate();
  });
  tfCount.addEventListener("input", () => { updateTypeHint(); validate(); });
  mcqCount.addEventListener("input", () => { updateTypeHint(); validate(); });

  // --- Difficulty sliders ---

  function setActivePreset(name) {
    document.querySelectorAll(".preset-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.preset === name);
    });
  }

  function matchPreset() {
    const e = parseInt(easySlider.value);
    const m = parseInt(mediumSlider.value);
    const h = parseInt(hardSlider.value);
    for (const [name, vals] of Object.entries(PRESETS)) {
      if (e === vals[0] && m === vals[1] && h === vals[2]) {
        setActivePreset(name);
        return;
      }
    }
    setActivePreset("custom");
  }

  function updateDifficultyDisplay() {
    const e = parseInt(easySlider.value);
    const m = parseInt(mediumSlider.value);
    const h = parseInt(hardSlider.value);
    easyValue.textContent = e + "%";
    mediumValue.textContent = m + "%";
    hardValue.textContent = h + "%";

    const total = e + m + h;
    diffTotal.textContent = "Total: " + total + "%";
    diffTotal.classList.toggle("valid", total === 100);
    diffTotal.classList.toggle("invalid", total !== 100);
    matchPreset();
  }

  easySlider.addEventListener("input", () => { updateDifficultyDisplay(); validate(); });
  mediumSlider.addEventListener("input", () => { updateDifficultyDisplay(); validate(); });
  hardSlider.addEventListener("input", () => { updateDifficultyDisplay(); validate(); });

  document.querySelectorAll(".preset-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const preset = btn.dataset.preset;
      if (preset === "custom") {
        setActivePreset("custom");
        return;
      }
      const vals = PRESETS[preset];
      easySlider.value = vals[0];
      mediumSlider.value = vals[1];
      hardSlider.value = vals[2];
      updateDifficultyDisplay();
      validate();
    });
  });

  // --- Validation ---

  function validate() {
    const docOk = !!docSelect.value;
    const total = parseInt(numQuestions.value) || 0;
    const totalOk = total >= 1 && total <= 20;
    const tf = parseInt(tfCount.value) || 0;
    const mcq = parseInt(mcqCount.value) || 0;
    const typeOk = tf + mcq === total && tf >= 0 && mcq >= 0;
    const e = parseInt(easySlider.value);
    const m = parseInt(mediumSlider.value);
    const h = parseInt(hardSlider.value);
    const diffOk = e + m + h === 100;

    generateBtn.disabled = !docOk || !totalOk || !typeOk || !diffOk || generating;
  }

  docSelect.addEventListener("change", validate);

  // --- Generate ---

  generateBtn.addEventListener("click", async () => {
    if (generating) return;
    generating = true;
    generateBtn.disabled = true;
    generateBtn.innerHTML = '<span class="spinner"></span>Generating...';
    genStatus.innerHTML = "";
    resultsArea.innerHTML = "";

    const body = {
      document_id: parseInt(docSelect.value),
      num_questions: parseInt(numQuestions.value),
      types: {
        true_false: parseInt(tfCount.value) || 0,
        mcq: parseInt(mcqCount.value) || 0,
      },
      difficulty: {
        easy: parseInt(easySlider.value),
        medium: parseInt(mediumSlider.value),
        hard: parseInt(hardSlider.value),
      },
    };

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Generation failed");

      generatedQuestions = data.questions;
      renderQuestions(data.questions, body.document_id);
    } catch (err) {
      genStatus.innerHTML = '<div class="status error">' + err.message + '</div>';
    }

    generating = false;
    generateBtn.innerHTML = "Generate Exam";
    validate();
  });

  // --- Render generated questions ---

  function renderQuestions(questions, documentId) {
    const doc = allDocs.find(d => d.id === documentId);
    const docName = doc ? doc.filename : "Unknown";

    let html = '<div class="card"><h2>Generated Questions (' + questions.length + ')</h2>';
    html += '<div class="questions-preview">';

    for (const q of questions) {
      const typeBadge = q.type === "true_false"
        ? '<span class="badge badge-tf">T/F</span>'
        : '<span class="badge badge-mcq">MCQ</span>';
      const diffBadge = '<span class="badge badge-' + q.difficulty + '">' + q.difficulty + '</span>';

      html += '<div class="q-card">';
      html += '<div class="q-header"><span class="q-num">Q' + q.id + '</span>' + typeBadge + diffBadge + '</div>';
      html += '<div class="q-text">' + escapeHtml(q.question) + '</div>';
      html += '<ul class="q-options">';
      for (const opt of q.options) {
        const isCorrect = opt === q.correct_answer;
        html += '<li class="' + (isCorrect ? 'correct' : '') + '">' + escapeHtml(opt) + (isCorrect ? ' &#10003;' : '') + '</li>';
      }
      html += '</ul>';
      if (q.explanation) {
        html += '<div class="q-explanation">' + escapeHtml(q.explanation) + '</div>';
      }
      html += '</div>';
    }

    html += '</div>';

    html += '<div class="post-actions">';
    html += '<button class="btn-outline" onclick="saveExam()">Save Exam</button>';
    html += '<button class="btn-secondary" onclick="exportExam(\'json\')">JSON</button>';
    html += '<button class="btn-secondary" onclick="exportExam(\'markdown\')">Markdown</button>';
    html += '<button class="btn-secondary" onclick="exportExam(\'text\')">Text</button>';
    html += '<button class="btn-secondary" onclick="exportExam(\'csv\')">CSV</button>';
    html += '</div>';

    html += '</div>';
    resultsArea.innerHTML = html;
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  // --- Save exam ---

  async function saveExam() {
    if (!generatedQuestions) return;
    const doc = allDocs.find(d => d.id === parseInt(docSelect.value));
    const title = (doc ? doc.filename : "Exam") + " - " + new Date().toLocaleDateString();

    try {
      const res = await fetch("/api/exams", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          document_id: parseInt(docSelect.value),
          title: title,
          questions: generatedQuestions,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Save failed");
      alert("Exam saved (ID: " + data.id + ")");
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  // --- Export exam (download from generated questions, no save needed) ---

  function exportExam(fmt) {
    if (!generatedQuestions) return;
    const doc = allDocs.find(d => d.id === parseInt(docSelect.value));
    const title = (doc ? doc.filename : "Exam") + " - " + new Date().toLocaleDateString();

    const exam = {
      title: title,
      filename: doc ? doc.filename : "N/A",
      num_questions: generatedQuestions.length,
      created_at: new Date().toISOString(),
      questions: generatedQuestions,
    };

    const EXTENSIONS = { json: ".json", markdown: ".md", text: ".txt", csv: ".csv" };
    const TYPES = { json: "application/json", markdown: "text/markdown", text: "text/plain", csv: "text/csv" };

    let content;
    if (fmt === "json") {
      content = JSON.stringify(generatedQuestions, null, 2);
    } else if (fmt === "csv") {
      content = exportCsv(generatedQuestions);
    } else if (fmt === "markdown") {
      content = exportMarkdown(exam);
    } else {
      content = exportText(exam);
    }

    const blob = new Blob([content], { type: TYPES[fmt] || "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "exam" + (EXTENSIONS[fmt] || ".txt");
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportCsv(questions) {
    const rows = [["id","type","difficulty","question","option_a","option_b","option_c","option_d","correct_answer","explanation"]];
    for (const q of questions) {
      const opts = [...q.options];
      while (opts.length < 4) opts.push("");
      rows.push([q.id, q.type, q.difficulty, q.question, opts[0], opts[1], opts[2], opts[3], q.correct_answer, q.explanation || ""]);
    }
    return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
  }

  function exportMarkdown(exam) {
    let md = "# " + exam.title + "\n";
    md += "**Document:** " + exam.filename + " | **Questions:** " + exam.num_questions + "\n\n---\n\n";
    for (const q of exam.questions) {
      md += "### Q" + q.id + " [" + q.type.toUpperCase().replace("_", "/") + " | " + q.difficulty[0].toUpperCase() + q.difficulty.slice(1) + "]\n";
      md += q.question + "\n\n";
      for (const opt of q.options) {
        md += "- " + opt + (opt === q.correct_answer ? " ✓" : "") + "\n";
      }
      md += "\n**Explanation:** " + (q.explanation || "") + "\n\n---\n\n";
    }
    return md;
  }

  function exportText(exam) {
    let txt = exam.title + "\n";
    txt += "Document: " + exam.filename + " | Questions: " + exam.num_questions + "\n\n";
    for (const q of exam.questions) {
      txt += "Q" + q.id + " [" + q.type + " | " + q.difficulty + "]\n";
      txt += q.question + "\n";
      q.options.forEach((opt, i) => {
        txt += "  " + String.fromCharCode(65 + i) + ") " + opt + (opt === q.correct_answer ? " (correct)" : "") + "\n";
      });
      txt += "Explanation: " + (q.explanation || "") + "\n\n";
    }
    return txt;
  }

  // --- Init ---
  loadDocuments();
  updateTypeHint();
  updateDifficultyDisplay();
</script>
</body>
</html>
